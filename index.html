<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>India PIN Code Finder</title>
  <meta name="description"
        content="Find Indian PIN code, post office, district, state, region and delivery information.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6fa;
      color: #172033;
      line-height: 1.5;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #0757a0, #1684d8);
      color: white;
      text-align: center;
      padding: 45px 20px;
    }

    header h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 17px;
      opacity: 0.95;
    }

    /* MAIN CARD */
    .container {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .card h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    /* SEARCH */
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box input {
      flex: 1;
      padding: 16px;
      border: 2px solid #d6dce5;
      border-radius: 10px;
      font-size: 18px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #1684d8;
    }

    .search-box button {
      padding: 16px 25px;
      border: none;
      border-radius: 10px;
      background: #0757a0;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .search-box button:hover {
      background: #06437d;
    }

    .search-box button:disabled {
      background: #8ba9c4;
      cursor: not-allowed;
    }

    /* MESSAGE */
    #message {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }

    .error {
      color: #d32f2f;
    }

    .success {
      color: #198754;
    }

    .loading {
      color: #0757a0;
    }

    /* RESULTS */
    #results {
      display: none;
      margin-top: 25px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 30px;
    }

    .summary-box {
      background: #f5f8fc;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
    }

    .summary-box .label {
      color: #667085;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .summary-box .value {
      font-size: 17px;
      font-weight: bold;
      color: #172033;
    }

    /* POST OFFICES */
    .office-title {
      margin-bottom: 15px;
      color: #0757a0;
    }

    .office {
      border: 1px solid #e0e5ec;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
    }

    .office h3 {
      color: #0757a0;
      margin-bottom: 10px;
    }

    .office p {
      margin: 5px 0;
      color: #444;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 30px 15px;
      color: #667085;
      font-size: 14px;
    }

    /* MOBILE */
    @media (max-width: 700px) {

      header h1 {
        font-size: 27px;
      }

      .card {
        padding: 20px;
      }

      .search-box {
        flex-direction: column;
      }

      .search-box button {
        width: 100%;
      }

      .summary {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 400px) {
      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>🇮🇳 India PIN Code Finder</h1>
    <p>Find Post Office details using a 6-digit Indian PIN Code</p>
  </header>


  <!-- MAIN -->
  <main class="container">

    <div class="card">

      <h2>🔎 Search PIN Code</h2>

      <div class="search-box">

        <input
          id="pincode"
          type="text"
          inputmode="numeric"
          maxlength="6"
          placeholder="Enter 6-digit PIN code"
          autocomplete="off"
        >

        <button id="searchButton" onclick="searchPIN()">
          Search
        </button>

      </div>

      <div id="message"></div>


      <!-- RESULTS -->
      <section id="results">

        <div class="summary">

          <div class="summary-box">
            <div class="label">PIN Code</div>
            <div class="value" id="pinResult">-</div>
          </div>

          <div class="summary-box">
            <div class="label">District</div>
            <div class="value" id="districtResult">-</div>
          </div>

          <div class="summary-box">
            <div class="label">State</div>
            <div class="value" id="stateResult">-</div>
          </div>

          <div class="summary-box">
            <div class="label">Region</div>
            <div class="value" id="regionResult">-</div>
          </div>

        </div>


        <h2 class="office-title">
          📮 Post Office Details
        </h2>

        <div id="officeList"></div>

      </section>

    </div>

  </main>


  <!-- FOOTER -->
  <footer>
    © 2026 India PIN Code Finder
    <br>
    Search Indian PIN code and post office information online.
  </footer>


  <script>

    /*
      INDIA PIN CODE SEARCH
      API:
      https://api.postalpincode.in/
    */


    async function searchPIN() {

      const input = document.getElementById("pincode");
      const button = document.getElementById("searchButton");
      const message = document.getElementById("message");
      const results = document.getElementById("results");
      const officeList = document.getElementById("officeList");

      const pin = input.value.trim();


      // Clear old results
      results.style.display = "none";
      officeList.innerHTML = "";


      // Validate PIN
      if (!/^[0-9]{6}$/.test(pin)) {

        message.className = "error";
        message.textContent =
          "❌ Please enter a valid 6-digit PIN code.";

        return;
      }


      // Loading
      button.disabled = true;

      message.className = "loading";
      message.textContent = "🔄 Searching PIN code...";


      try {

        const response = await fetch(
          "https://api.postalpincode.in/pincode/" + pin
        );


        if (!response.ok) {
          throw new Error("Network error");
        }


        const data = await response.json();


        if (
          !data ||
          !data[0] ||
          data[0].Status !== "Success" ||
          !data[0].PostOffice ||
          data[0].PostOffice.length === 0
        ) {

          message.className = "error";

          message.textContent =
            "❌ PIN code not found. Please check the number.";

          return;
        }


        const offices = data[0].PostOffice;

        const first = offices[0];


        // Summary information
        document.getElementById("pinResult").textContent = pin;

        document.getElementById("districtResult").textContent =
          first.District || "-";

        document.getElementById("stateResult").textContent =
          first.State || "-";

        document.getElementById("regionResult").textContent =
          first.Region || "-";


        // Create post-office cards
        offices.forEach(function(office) {

          const card = document.createElement("div");

          card.className = "office";


          const title = document.createElement("h3");

          title.textContent =
            "📮 " + (office.Name || "Unknown Post Office");


          const branch = document.createElement("p");

          branch.innerHTML =
            "<strong>Branch Type:</strong> " +
            escapeHTML(office.BranchType || "-");


          const delivery = document.createElement("p");

          delivery.innerHTML =
            "<strong>Delivery Status:</strong> " +
            escapeHTML(office.DeliveryStatus || "-");


          const district = document.createElement("p");

          district.innerHTML =
            "<strong>District:</strong> " +
            escapeHTML(office.District || "-");


          const state = document.createElement("p");

          state.innerHTML =
            "<strong>State:</strong> " +
            escapeHTML(office.State || "-");


          const division = document.createElement("p");

          division.innerHTML =
            "<strong>Division:</strong> " +
            escapeHTML(office.Division || "-");


          card.appendChild(title);
          card.appendChild(branch);
          card.appendChild(delivery);
          card.appendChild(district);
          card.appendChild(state);
          card.appendChild(division);

          officeList.appendChild(card);

        });


        // Show results
        results.style.display = "block";

        message.className = "success";

        message.textContent =
          "✅ Found " + offices.length + " post office(s).";


      } catch (error) {

        console.error(error);

        message.className = "error";

        message.textContent =
          "❌ Unable to connect. Please try again later.";

      } finally {

        button.disabled = false;

      }

    }


    /*
      Security helper
      Prevents API data from being interpreted as HTML.
    */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      Press ENTER to search
    */

    document
      .getElementById("pincode")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          searchPIN();
        }

      });


    /*
      Allow only numbers
    */

    document
      .getElementById("pincode")
      .addEventListener("input", function() {

        this.value = this.value.replace(/\D/g, "");

      });

  </script>

</body>
</html>
